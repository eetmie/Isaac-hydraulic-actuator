exclude: ^local/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve byte-for-byte firmware evidence and vendored source hashes.
        exclude: ^(models/|drive_logs/|training/fusion/)
      - id: end-of-file-fixer
        exclude: ^(models/|drive_logs/|training/fusion/)
      - id: check-added-large-files
        # Small self-contained USDs and the selected 2.3 MB MLP ship in Git.
        args: [--maxkb=4096]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: debug-statements
