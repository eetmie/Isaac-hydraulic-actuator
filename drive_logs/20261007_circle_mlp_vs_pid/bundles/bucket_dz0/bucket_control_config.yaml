# Bucket cutting tip and link vectors extracted from the controller USD.
# Origin: slew bearing; boom pivot Z = 78.5 mm, confirmed by production CAD.
# Joint angles remain relative IMU angles; do not add fixed USD rotations to them.
# pitch_offset_rad defines the cutting lip, not the final joint-frame orientation.
# CAD IMU magnitudes: liftboom 13.832 deg; tiltboom 0.612 deg. Signs unverified.
# Active mounting quaternions copied from the current robot profile.
# Actor histories are translated back to training joint zeros; PID/FK use runtime zeros.
rates:
  control_hz: 100.0
imu:
  imu_mapping:
    base: 1
    boom: 2
    arm: 0
    bucket: 3
  chain:
  - joint: slew
    output_index: 0
    axis: z
    extraction: relative_axis_twist
    role: base
  - joint: lift
    role: boom
    parent_role: base
    output_index: 1
    axis: y
    extraction: gravity_pitch_delta
  - joint: arm
    role: arm
    parent_role: boom
    output_index: 2
    axis: y
    extraction: gravity_pitch_delta
  - joint: bucket
    role: bucket
    parent_role: arm
    output_index: 3
    axis: y
    extraction: gravity_pitch_delta
  mounting_offsets_quat:
    base:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    boom:
    - 0.9927048
    - 0.0
    - 0.12057
    - 0.0
    arm:
    - 0.999985738456
    - 0.0
    - 0.005340682122
    - 0.0
    bucket:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
robot:
  joints:
  - name: slew
    axis:
    - 0.0
    - 0.0
    - 1.0
    parent_to_joint_xyz:
    - 0.0
    - 0.0
    - 0.0
  - name: boom
    axis:
    - 0.0
    - 1.0
    - 0.0
    parent_to_joint_xyz:
    - 0.01650003343820572
    - 5.899987165491893e-09
    - 0.07850001752376556
  - name: arm
    axis:
    - 0.0
    - 1.0
    - 0.0
    parent_to_joint_xyz:
    - 0.46771255135536194
    - 0.0
    - -2.4013221263885498e-05
  - name: bucket
    axis:
    - 0.0
    - 1.0
    - 0.0
    parent_to_joint_xyz:
    - 0.24999994039535522
    - 5.104010547540838e-10
    - -0.0024999603629112244
  tool:
    parent_to_tip_xyz:
    - -0.01219642162322998
    - 2.859028569446309e-08
    - -0.13275668025016785
    pitch_offset_rad: 2.806488513946533
    name: bucket
  coordinate_origin: slew_bearing
pid:
  joint0:
    kp: 5.5
    ki: 0.2
    kd: 0.25
  joint1:
    kp: 10.0
    ki: 0.4
    kd: 0.0
  joint2:
    kp: 10.0
    ki: 0.4
    kd: 0.0
  joint3:
    kp: 5.0
    ki: 0.25
    kd: 0.0
controller:
  output_limits_min: -1.0
  output_limits_max: 1.0
  enable_velocity_limiting: false
  per_joint_max_velocity:
  - 0.1
  - 0.12
  - 0.12
  - 0.12
ik:
  command_type: pose
  use_relative_mode: false
  method: dls
  velocity_mode: false
  velocity_error_gain: 250.0
  use_rotational_velocity: false
  params:
    k_val: 1.45
    min_singular_value: 1.0e-05
    lambda_val: 0.001
  condition_number_threshold: 40
  enable_adaptive_damping: true
  adaptive_damping_max_multiplier: 2.0
  joint_limits_relative:
  - null
  - - -50.0
    - 30.0
  - - 28.0
    - 144.0
  - - -120.0
    - 20.0
reachability:
  enabled: true
  pos_tol_m: 0.005
  max_iters: 80
  min_target_delta_m: 0.002
