class_name: OnPolicyRunner
seed: 7
device: cuda:0
num_steps_per_env: 24
max_iterations: 300
save_interval: 100
experiment_name: hydraulic_controller
run_name: v2_a256x2_s7_gyro
logger: tensorboard
check_for_nan: true
multi_gpu: null
obs_groups:
  actor:
  - policy
  critic:
  - critic
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  activation: tanh
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  activation: tanh
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
